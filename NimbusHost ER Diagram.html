<style>:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--mu:#64748b;--ln:#475569;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
