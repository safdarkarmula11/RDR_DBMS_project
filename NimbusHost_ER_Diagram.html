  else{pos[drag.n].x=drag.ox+dx/view.k;pos[drag.n].y=drag.oy+dy/view.k;place(drag.g,drag.n);drawEdges()}}
function onUp(){drag=null;document.getElementById('stage').classList.remove('drag');window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);setTimeout(()=>moved=false,0)}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const k=Math.min(2.5,Math.max(.12,view.k*(e.deltaY<0?1.12:1/1.12)));view.x=mx-(mx-view.x)*(k/view.k);view.y=my-(my-view.y)*(k/view.k);view.k=k;applyView()},{passive:false});
function fit(names){
  const list=(names||DATA.tables.map(t=>t.name)).filter(n=>!hiddenGroups.has(groupOf[n]));if(!list.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(n=>{x0=Math.min(x0,pos[n].x);y0=Math.min(y0,pos[n].y);x1=Math.max(x1,pos[n].x+W);y1=Math.max(y1,pos[n].y+height(T[n]))});
  const r=svg.getBoundingClientRect(),m=40,k=Math.min(1.1,(r.width-2*m)/(x1-x0),(r.height-2*m)/(y1-y0));
  view.k=k;view.x=m+(r.width-2*m-(x1-x0)*k)/2-x0*k;view.y=m+(r.height-2*m-(y1-y0)*k)/2-y0*k;applyView()}
/* tooltip */
const tipEl=document.getElementById('tip');function tip(e,h){tipEl.innerHTML=h;tipEl.style.display='block';tipEl.style.left=Math.min(e.clientX+14,innerWidth-340)+'px';tipEl.style.top=(e.clientY+14)+'px'}function tipOff(){tipEl.style.display='none'}
/* side panel */
function badge(c){return (c.pk?'<span class="b pk">PK</span>':'')+(c.fk?'<span class="b fk">FK</span>':'')+(c.unique?'<span class="b uq">UQ</span>':'')+(c.nullable&&!c.pk?'<span class="b nl">NULL</span>':'')}
function side(){
  const s=document.getElementById('side');
  if(!selected){
    s.innerHTML=`<h2>Overview</h2><div class="mute">${DATA.tables.length} tables &middot; ${DATA.fks.filter(f=>!f.logical).length} foreign keys + ${DATA.fks.filter(f=>f.logical).length} logical link</div>
    <h3>How to read it</h3><div>Each box is a table. <span class="b pk">PK</span> primary key, <span class="b fk">FK</span> foreign key, <span class="b uq">UQ</span> unique, <span class="b nl">NULL</span> optional. Lines join a foreign key column to the key it references.
    <br><br>Line-end labels give cardinality: at the parent end <b>1</b>; at the child end <b>N</b> (many), <b>0..N</b> (many, FK optional), <b>1</b> or <b>0..1</b> (unique FK).
    <br><br>The dashed orange line is a <b>logical</b> link: <span class="mono">usage_records.instance_id</span> has no real FK because MySQL forbids foreign keys on partitioned tables; the database enforces it with a trigger.</div>
    <h3>Groups</h3>`+Object.entries(DATA.groups).map(([g,ts])=>`<div style="margin:3px 0"><span class="tag" style="background:${COLORS[g]}">${g}</span> <span class="mute">${ts.length}</span></div>`).join('')+
    `<h3>Tables</h3>`+DATA.tables.map(t=>`<a class="lk" onclick="jump('${t.name}')">${t.name}</a>`).join(' &middot; ');
    return}
  const t=T[selected],out=DATA.fks.filter(f=>f.src===selected),inn=DATA.fks.filter(f=>f.dst===selected);
  s.innerHTML=`<h2 class="mono">${t.name}</h2><span class="tag" style="background:${COLORS[groupOf[t.name]]}">${groupOf[t.name]}</span>
  <h3>Columns (${t.cols.length})</h3><table class="c">${t.cols.map(c=>`<tr><td>${badge(c)}</td><td class="mono"><b>${c.name}</b></td><td class="mute mono">${c.type}</td></tr>`).join('')}</table>
  <h3>References (${out.length})</h3>${out.length?out.map(f=>`<div><span class="mono">${f.col}</span> &rarr; <a class="lk mono" onclick="jump('${f.dst}')">${f.dst}.${f.dcol}</a>${f.logical?' <span class="mute">(logical)</span>':''}</div>`).join(''):'<span class="mute">none</span>'}
  <h3>Referenced by (${inn.length})</h3>${inn.length?inn.map(f=>`<div><a class="lk mono" onclick="jump('${f.src}')">${f.src}.${f.col}</a> &rarr; <span class="mono">${f.dcol}</span></div>`).join(''):'<span class="mute">none</span>'}
  <h3></h3><button onclick="selected=null;applyState();side()">Clear selection</button>`}
function jump(n){if(hiddenGroups.has(groupOf[n])){hiddenGroups.delete(groupOf[n]);legend();drawEdges()}selected=n;applyState();side();fit([...neighbors(n)])}
/* controls */
document.getElementById('fit').onclick=()=>fit();
document.getElementById('reset').onclick=()=>{initLayout();build();fit()};
document.getElementById('keys').onchange=e=>{keysOnly=e.target.checked;build()};
document.getElementById('types').onchange=e=>{showTypes=e.target.checked;build()};
document.getElementById('theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#12141c';r.setAttribute('data-theme',d?'light':'dark')};
document.getElementById('q').oninput=e=>{const v=e.target.value.trim().toLowerCase();
  if(!v){matches=null}else{matches=new Set(DATA.tables.filter(t=>t.name.includes(v)||t.cols.some(c=>c.name.toLowerCase().includes(v))).map(t=>t.name))}applyState()};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'&&matches&&matches.size)fit([...matches])};
document.getElementById('svgdl').onclick=()=>{const c=svg.cloneNode(true);c.setAttribute('xmlns',NS);c.setAttribute('width',2400);c.setAttribute('height',1500);
  const st=getComputedStyle(document.documentElement);let css='';['--card','--cardline','--row','--edge','--ink','--mute','--hi'].forEach(v=>css+=`${v}:${st.getPropertyValue(v)};`);c.setAttribute('style',css+'background:'+st.getPropertyValue('--bg'));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.outerHTML],{type:'image/svg+xml'}));a.download='nimbushost-er.svg';a.click()};
function legend(){const L=document.getElementById('legend');L.innerHTML='';Object.keys(DATA.groups).forEach(g=>{const l=document.createElement('label');
  l.innerHTML=`<input type="checkbox" ${hiddenGroups.has(g)?'':'checked'}><i style="background:${COLORS[g]}"></i>${g}`;
  l.querySelector('input').onchange=e=>{e.target.checked?hiddenGroups.delete(g):hiddenGroups.add(g);applyState();drawEdges()};L.appendChild(l)})}
document.getElementById('stats').textContent=`${DATA.tables.length} tables · ${DATA.fks.length} relationships`;
legend();initLayout();build();applyView();requestAnimationFrame(()=>{fit();side()});addEventListener('resize',()=>fit());
</script></body></html>
